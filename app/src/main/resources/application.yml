server:
  port: ${PORT:8080}

spring:
  application:
    name: aradexperience-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aradexperience}
    username: ${POSTGRES_USER:arad}
    password: ${POSTGRES_PASSWORD:arad}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema vine DOAR din Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # story-urile au numere de migrare rezervate (V5 bilete, V6 firme, V7 oferte…) și se unesc în altă ordine: o migrare cu număr
    # mai mic, venită după una mai mare, trebuie aplicată, nu refuzată (altfel V5 nu pornește pe o bază care are deja V6)
    out-of-order: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:                # pozele din panou: limita reală (10 MB) e verificată în MediaService, cu mesaj clar
      max-file-size: 20MB
      max-request-size: 21MB

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  anthropic:                  # Claude API (T12 chat, T13 itinerar) — SDK-ul oficial com.anthropic:anthropic-java
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
  twilio:                     # T21: SMS-ul OTP pentru numerele reale (Twilio Verify); gol → 503 „SMS unavailable”
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    base-url: ${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com}
  transit:                    # T22: API-ul public Telelink (CTP Arad), fără cheie; tenantul din URL se poate schimba
    base-url: ${TRANSIT_BASE_URL:https://www.telelink.city/api/v1/e39aa927-11c1-435f-92b9-57804f7bc1b4/transport/planner}
  events:
    hot-participants: 50
    hot-saves: 20
  media:                      # pozele încărcate din panou: S3 dacă MEDIA_BUCKET e setat, altfel pe disc (MEDIA_LOCAL_DIR)
    bucket: ${MEDIA_BUCKET:}
    region: ${AWS_REGION:eu-north-1}
    public-url: ${MEDIA_PUBLIC_URL:}        # ex. https://api.exemplu.ro/api/v1/media; gol = adresa cererii
    local-dir: ${MEDIA_LOCAL_DIR:uploads}
    max-upload-bytes: 10485760              # 10 MB
    max-import-bytes: 15728640              # 15 MB (pozele copiate de pe alte site-uri)
    auto-sync: ${MEDIA_AUTO_SYNC:true}      # copiază singur în S3 pozele de pe alte site-uri (doar cu bucket + public-url)
    sync-interval-ms: 120000                # la 2 minute; prima rulare la 1 minut după pornire

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    aradexperience: INFO
