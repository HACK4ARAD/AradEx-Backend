server:
  port: ${PORT:8080}

spring:
  application:
    name: aradexperience-api
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/aradexperience}
    username: ${POSTGRES_USER:arad}
    password: ${POSTGRES_PASSWORD:arad}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # schema vine DOAR din Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # story-urile au numere de migrare rezervate (V5 bilete, V6 firme, V7 oferte…) și se unesc în altă ordine: o migrare cu număr
    # mai mic, venită după una mai mare, trebuie aplicată, nu refuzată (altfel V5 nu pornește pe o bază care are deja V6)
    out-of-order: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  anthropic:                  # Claude API (T12 chat, T13 itinerar) — SDK-ul oficial com.anthropic:anthropic-java
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
  twilio:                     # T21: SMS-ul OTP pentru numerele reale (Twilio Verify); gol → 503 „SMS unavailable”
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
    base-url: ${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com}
  events:
    hot-participants: 50
    hot-saves: 20

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    aradexperience: INFO
