// :app — APLICAȚIA Spring Boot: controller (+ handler) / service / repository / entity / mapper + config, security, util,
// resources (application.yml, migrări Flyway). Depinde de :api (contractul) și e singurul modul rulabil.
plugins {
    id 'java'
    id 'org.springframework.boot'
}

ext {
    jjwtVersion = '0.12.6'
    springdocVersion = '2.6.0'
    awsSdkVersion = '2.29.52'     // pozele în S3 (media): doar modulul s3, credențiale din rolul task-ului ECS
}

dependencies {
    implementation project(':api')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    // T12: Claude (Anthropic API), SDK-ul oficial — aprobat în CLAUDE.md / STATUS (AI = Claude)
    implementation 'com.anthropic:anthropic-java:3.2.0'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

springBoot { mainClass = 'aradexperience.Application' }

bootJar { archiveFileName = 'app.jar' }
jar { enabled = false }   // doar bootJar-ul contează

// Spring nu citește .env singur: la `bootRun` încărcăm ../.env (dacă există) în mediul procesului.
bootRun {
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') && it.contains('=') }
            .each { line ->
                def (k, v) = line.split('=', 2)
                environment k.trim(), v.trim().replaceAll(/^"|"$/, '')
            }
    }
}
